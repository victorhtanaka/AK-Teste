version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: weather-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-WeatherDbPass123!}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $${MSSQL_SA_PASSWORD:-WeatherDbPass123!} -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather-dashboard-app
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=WeatherDashboardDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-WeatherDbPass123!};TrustServerCertificate=True;MultipleActiveResultSets=true;
      - OpenWeather__ApiKey=${OPENWEATHER_API_KEY:-}
      - WeatherCollector__IntervalMinutes=15
    ports:
      - "5000:8080"
    restart: unless-stopped

volumes:
  sqlserver_data:
